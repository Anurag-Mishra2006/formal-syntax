<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="400" fill="#111111"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 8L5 2L9 8" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- LEFT: Before merge -->
  <text x="210" y="38" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="16" font-weight="500">Before merge</text>

  <circle cx="60" cy="130" r="30" fill="#1a6b50" stroke="#0f6e56" stroke-width="1"/>
  <text x="60" y="136" text-anchor="middle" fill="#e0fff8" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C1</text>
  <line x1="91" y1="130" x2="130" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle cx="162" cy="130" r="30" fill="#1a6b50" stroke="#0f6e56" stroke-width="1"/>
  <text x="162" y="136" text-anchor="middle" fill="#e0fff8" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C2</text>
  <line x1="193" y1="130" x2="230" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle cx="262" cy="130" r="30" fill="#4040aa" stroke="#6060cc" stroke-width="1"/>
  <text x="262" y="136" text-anchor="middle" fill="#e0e0ff" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C3</text>
  <line x1="293" y1="130" x2="330" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle cx="362" cy="130" r="30" fill="#4040aa" stroke="#6060cc" stroke-width="1"/>
  <text x="362" y="136" text-anchor="middle" fill="#e0e0ff" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C4</text>

  <!-- master label before -->
  <rect x="114" y="172" width="96" height="30" rx="8" fill="#555555" stroke="#777" stroke-width="1"/>
  <text x="162" y="192" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="13">master</text>
  <line x1="162" y1="172" x2="162" y2="161" stroke="#888" stroke-width="1.2" marker-end="url(#arr-up)"/>

  <!-- feature label before -->
  <rect x="314" y="172" width="96" height="30" rx="8" fill="#3a2d8a" stroke="#5040b0" stroke-width="1"/>
  <text x="362" y="192" text-anchor="middle" fill="#c0b8f0" font-family="-apple-system,sans-serif" font-size="13">feature</text>
  <line x1="362" y1="172" x2="362" y2="161" stroke="#888" stroke-width="1.2" marker-end="url(#arr-up)"/>

  <!-- Divider -->
  <line x1="450" y1="30" x2="450" y2="320" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- RIGHT: After fast-forward merge -->
  <text x="670" y="38" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="16" font-weight="500">After fast-forward merge</text>

  <circle cx="510" cy="130" r="30" fill="#1a6b50" stroke="#0f6e56" stroke-width="1"/>
  <text x="510" y="136" text-anchor="middle" fill="#e0fff8" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C1</text>
  <line x1="541" y1="130" x2="580" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle cx="612" cy="130" r="30" fill="#1a6b50" stroke="#0f6e56" stroke-width="1"/>
  <text x="612" y="136" text-anchor="middle" fill="#e0fff8" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C2</text>
  <line x1="643" y1="130" x2="680" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle cx="712" cy="130" r="30" fill="#4040aa" stroke="#6060cc" stroke-width="1"/>
  <text x="712" y="136" text-anchor="middle" fill="#e0e0ff" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C3</text>
  <line x1="743" y1="130" x2="780" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle cx="812" cy="130" r="30" fill="#4040aa" stroke="#6060cc" stroke-width="1"/>
  <text x="812" y="136" text-anchor="middle" fill="#e0e0ff" font-family="-apple-system,sans-serif" font-size="15" font-weight="600">C4</text>

  <!-- master + feature both at C4 -->
  <rect x="764" y="172" width="96" height="30" rx="8" fill="#555555" stroke="#777" stroke-width="1"/>
  <text x="812" y="192" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="13">master</text>
  <line x1="812" y1="172" x2="812" y2="161" stroke="#888" stroke-width="1.2" marker-end="url(#arr-up)"/>

  <rect x="764" y="210" width="96" height="30" rx="8" fill="#3a2d8a" stroke="#5040b0" stroke-width="1"/>
  <text x="812" y="230" text-anchor="middle" fill="#c0b8f0" font-family="-apple-system,sans-serif" font-size="13">feature</text>

  <!-- caption -->
  <text x="450" y="350" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">master simply slid forward. No new commit. History stays perfectly linear.</text>
  <text x="450" y="372" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">Git prints: "Fast-forward" in the terminal output.</text>
</svg>
