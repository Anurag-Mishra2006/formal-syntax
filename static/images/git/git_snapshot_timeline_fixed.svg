<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg" style="background:#111111;">
  <title>Git as a snapshot timeline</title>
  <desc>Git records snapshots of your project at points in time, connected in a chain. Each snapshot knows its parent.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <mask id="text-gaps" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="680" height="340" fill="white"/>
      <!-- S1 label gaps -->
      <rect x="99" y="136" width="22" height="21" fill="black" rx="2"/>
      <rect x="97" y="154" width="27" height="19" fill="black" rx="2"/>
      <rect x="80" y="184" width="61" height="19" fill="black" rx="2"/>
      <rect x="88" y="199" width="44" height="19" fill="black" rx="2"/>
      <!-- knows parent 1 gaps -->
      <rect x="158" y="126" width="45" height="19" fill="black" rx="2"/>
      <rect x="157" y="140" width="46" height="19" fill="black" rx="2"/>
      <!-- S2 label gaps -->
      <rect x="243" y="136" width="25" height="21" fill="black" rx="2"/>
      <rect x="240" y="154" width="31" height="19" fill="black" rx="2"/>
      <rect x="225" y="184" width="61" height="19" fill="black" rx="2"/>
      <rect x="237" y="199" width="36" height="19" fill="black" rx="2"/>
      <!-- knows parent 2 gaps -->
      <rect x="303" y="126" width="45" height="19" fill="black" rx="2"/>
      <rect x="302" y="140" width="46" height="19" fill="black" rx="2"/>
      <!-- S3 label gaps -->
      <rect x="388" y="136" width="25" height="21" fill="black" rx="2"/>
      <rect x="389" y="154" width="23" height="19" fill="black" rx="2"/>
      <rect x="376" y="184" width="49" height="19" fill="black" rx="2"/>
      <rect x="377" y="199" width="47" height="19" fill="black" rx="2"/>
      <!-- knows parent 3 gaps -->
      <rect x="448" y="126" width="45" height="19" fill="black" rx="2"/>
      <rect x="447" y="140" width="46" height="19" fill="black" rx="2"/>
      <!-- S4 label gaps -->
      <rect x="532" y="136" width="25" height="21" fill="black" rx="2"/>
      <rect x="524" y="154" width="42" height="19" fill="black" rx="2"/>
      <rect x="520" y="184" width="50" height="19" fill="black" rx="2"/>
      <rect x="515" y="199" width="60" height="19" fill="black" rx="2"/>
      <!-- top text gap -->
      <rect x="197" y="48" width="261" height="19" fill="black" rx="2"/>
      <!-- bottom text gaps -->
      <rect x="74" y="256" width="532" height="19" fill="black" rx="2"/>
      <rect x="209" y="276" width="261" height="19" fill="black" rx="2"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="680" height="340" fill="#111111"/>

  <!-- Main timeline line -->
  <line x1="60" y1="150" x2="620" y2="150" stroke="#555555" stroke-width="1.5" mask="url(#text-gaps)"/>

  <!-- S1 node -->
  <circle cx="110" cy="150" r="28" fill="#1a6b50" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="110" y="147" text-anchor="middle" dominant-baseline="central" fill="#7fffd4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500">S1</text>
  <text x="110" y="163" text-anchor="middle" dominant-baseline="central" fill="#5ecfaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">init</text>
  <text x="110" y="198" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">First files</text>
  <text x="110" y="213" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">added</text>

  <!-- Arrow S1→S2 + label -->
  <line x1="140" y1="150" x2="218" y2="150" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#text-gaps)"/>
  <text x="180" y="135" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">knows</text>
  <text x="180" y="150" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">parent</text>

  <!-- S2 node -->
  <circle cx="255" cy="150" r="28" fill="#1a6b50" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="255" y="147" text-anchor="middle" dominant-baseline="central" fill="#7fffd4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500">S2</text>
  <text x="255" y="163" text-anchor="middle" dominant-baseline="central" fill="#5ecfaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">feat</text>
  <text x="255" y="198" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Add login</text>
  <text x="255" y="213" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">page</text>

  <!-- Arrow S2→S3 + label -->
  <line x1="285" y1="150" x2="363" y2="150" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#text-gaps)"/>
  <text x="325" y="135" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">knows</text>
  <text x="325" y="150" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">parent</text>

  <!-- S3 node -->
  <circle cx="400" cy="150" r="28" fill="#1a6b50" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="400" y="147" text-anchor="middle" dominant-baseline="central" fill="#7fffd4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500">S3</text>
  <text x="400" y="163" text-anchor="middle" dominant-baseline="central" fill="#5ecfaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">fix</text>
  <text x="400" y="198" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Fix bug</text>
  <text x="400" y="213" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">in auth</text>

  <!-- Arrow S3→S4 + label -->
  <line x1="430" y1="150" x2="508" y2="150" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#text-gaps)"/>
  <text x="470" y="135" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">knows</text>
  <text x="470" y="150" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">parent</text>

  <!-- S4 HEAD node (amber/orange) -->
  <circle cx="545" cy="150" r="28" fill="#8a5200" stroke="#a06010" stroke-width="0.5"/>
  <text x="545" y="147" text-anchor="middle" dominant-baseline="central" fill="#ffd580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500">S4</text>
  <text x="545" y="163" text-anchor="middle" dominant-baseline="central" fill="#e8a030" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">HEAD</text>
  <text x="545" y="198" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">You are</text>
  <text x="545" y="213" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">here now</text>

  <!-- Dashed arc "travel back" arrow -->
  <path d="M 545 122 Q 327 50 110 122" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="327" y="58" text-anchor="middle" fill="#cccccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">You can travel back to any snapshot instantly</text>

  <!-- Bottom caption -->
  <text x="340" y="270" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Each circle = one saved snapshot (commit). Git stores the full state of all files at that moment.</text>
  <text x="340" y="290" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Click a snapshot to learn what data it holds →</text>
</svg>
