<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" style="background:#111111;">
  <rect width="900" height="520" fill="#111111"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Working tree box -->
  <rect x="40" y="80" width="240" height="340" rx="18" fill="#1a4a8a" stroke="#2a5aaa" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" fill="#e0e8ff" font-family="-apple-system,sans-serif" font-size="18" font-weight="600">Working tree</text>
  <text x="160" y="142" text-anchor="middle" fill="#7ab0f0" font-family="-apple-system,sans-serif" font-size="14">Your actual files on disk</text>
  <!-- files -->
  <rect x="68" y="160" width="184" height="38" rx="8" fill="#555555"/>
  <text x="160" y="184" text-anchor="middle" fill="#dddddd" font-family="-apple-system,sans-serif" font-size="15">index.html</text>
  <rect x="68" y="210" width="184" height="38" rx="8" fill="#555555"/>
  <text x="160" y="234" text-anchor="middle" fill="#dddddd" font-family="-apple-system,sans-serif" font-size="15">style.css</text>
  <rect x="68" y="260" width="184" height="38" rx="8" fill="#7a5200" stroke="#a06800" stroke-width="1"/>
  <text x="160" y="284" text-anchor="middle" fill="#ffa030" font-family="-apple-system,sans-serif" font-size="15">app.js ✎ edited</text>
  <rect x="68" y="310" width="184" height="38" rx="8" fill="#2a6a20" stroke="#3a8a28" stroke-width="1"/>
  <text x="160" y="334" text-anchor="middle" fill="#80ee60" font-family="-apple-system,sans-serif" font-size="15">notes.txt + new</text>
  <!-- caption -->
  <text x="160" y="420" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">Everything you see</text>
  <text x="160" y="438" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">in your folder</text>

  <!-- Arrow 1 -->
  <line x1="284" y1="260" x2="330" y2="260" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="307" y="248" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="13">git add</text>

  <!-- Staging area box -->
  <rect x="334" y="80" width="220" height="340" rx="18" fill="#3a2d8a" stroke="#5040b0" stroke-width="1.5"/>
  <text x="444" y="118" text-anchor="middle" fill="#e0e0ff" font-family="-apple-system,sans-serif" font-size="18" font-weight="600">Staging area</text>
  <text x="444" y="142" text-anchor="middle" fill="#a090e0" font-family="-apple-system,sans-serif" font-size="14">Your draft commit</text>
  <rect x="360" y="165" width="168" height="38" rx="8" fill="#7a5200" stroke="#a06800" stroke-width="1"/>
  <text x="444" y="189" text-anchor="middle" fill="#ffa030" font-family="-apple-system,sans-serif" font-size="14">app.js ✎ staged</text>
  <rect x="360" y="215" width="168" height="38" rx="8" fill="#2a6a20" stroke="#3a8a28" stroke-width="1"/>
  <text x="444" y="239" text-anchor="middle" fill="#80ee60" font-family="-apple-system,sans-serif" font-size="14">notes.txt staged</text>
  <text x="444" y="300" text-anchor="middle" fill="#c0b8f0" font-family="-apple-system,sans-serif" font-size="13">Only these files</text>
  <text x="444" y="318" text-anchor="middle" fill="#c0b8f0" font-family="-apple-system,sans-serif" font-size="13">will be committed</text>
  <!-- caption -->
  <text x="444" y="420" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">A holding area —</text>
  <text x="444" y="438" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">also called "the index"</text>

  <!-- Arrow 2 -->
  <line x1="558" y1="260" x2="604" y2="260" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="581" y="248" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="13">git commit</text>

  <!-- Repository box -->
  <rect x="608" y="80" width="252" height="340" rx="18" fill="#0d5a4a" stroke="#1a7a60" stroke-width="1.5"/>
  <text x="734" y="118" text-anchor="middle" fill="#e0fff8" font-family="-apple-system,sans-serif" font-size="18" font-weight="600">Repository</text>
  <text x="734" y="142" text-anchor="middle" fill="#50e0b0" font-family="-apple-system,sans-serif" font-size="14">Permanent history</text>
  <rect x="634" y="165" width="200" height="38" rx="8" fill="#444444"/>
  <text x="734" y="189" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="14">commit a3f9...</text>
  <rect x="634" y="215" width="200" height="38" rx="8" fill="#444444"/>
  <text x="734" y="239" text-anchor="middle" fill="#cccccc" font-family="-apple-system,sans-serif" font-size="14">commit 7d21...</text>
  <rect x="634" y="265" width="200" height="38" rx="8" fill="#7a5200" stroke="#a06800" stroke-width="1"/>
  <text x="734" y="289" text-anchor="middle" fill="#ffa030" font-family="-apple-system,sans-serif" font-size="14">commit 1b8c... ←new</text>
  <!-- caption -->
  <text x="734" y="420" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">Lives inside .git/</text>
  <text x="734" y="438" text-anchor="middle" fill="#aaaaaa" font-family="-apple-system,sans-serif" font-size="13">folder, never touch it</text>
</svg>
